<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenshot element - qaloop demo</title>
<style>
  body { font-family: sans-serif; padding: 48px; background: #ffffff; }
  .card { width: 240px; height: 120px; border-radius: 8px; color: #ffffff;
          font-size: 28px; font-weight: bold; line-height: 120px;
          text-align: center; margin-bottom: 24px; }
  #card-a { background: #315fd6; }
  #card-b { background: #d64531; }
</style>
</head>
<body>
  <h1>Screenshot element demo</h1>
  <p>Two same-sized cards with different colors and labels, so an element
     screenshot baseline for one can never match the other (issue #170).</p>
  <div class="card" id="card-a">Alpha</div>
  <div class="card" id="card-b">Beta</div>
</body>
</html>
