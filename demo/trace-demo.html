<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qaloop artifacts trace demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  #out { margin: 1rem 0; padding: 1rem; border: 1px solid #ccc; min-height: 2rem; }
  button { padding: .5rem 1.25rem; }
</style>
</head>
<body>
<h1>Artifacts trace demo</h1>
<div id="out" role="status" aria-live="polite">idle</div>
<button id="trace-btn" type="button">Run traced action</button>

<script>
document.getElementById('trace-btn').addEventListener('click', () => {
  document.getElementById('out').textContent = 'traced action done TRACE-176';
});
</script>
</body>
</html>
