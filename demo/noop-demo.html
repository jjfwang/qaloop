<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intentionally dead control - qaloop demo</title>
<style>
  body { font-family: sans-serif; padding: 48px; max-width: 560px; }
  button { padding: 8px 16px; font-size: 15px; }
  #status { display: inline-block; padding: 4px 12px; background: #eee; }
</style>
</head>
<body>
  <h1>Intentionally dead control demo</h1>
  <p>The export button below is intentionally inert: it has no effective
  handler, so clicking it must not change the status. A working export
  control would change the status text to exported.</p>
  <button id="dead">Export report (coming soon)</button>
  <span id="status">idle</span>
<script>
  // Intentionally dead: the handler does nothing, by design.
  document.getElementById("dead").addEventListener("click", function () {});
</script>
</body>
</html>
