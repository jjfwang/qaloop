<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qaloop mock delay_ms loading-state demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  #out { margin: 1rem 0; padding: 1rem; border: 1px solid #ccc; min-height: 2rem; }
  #spinner { margin: 1rem 0; font-weight: 600; }
  button { padding: .5rem 1.25rem; }
</style>
</head>
<body>
<h1>Mock delay: loading state demo</h1>
<button id="load">Load greeting</button>
<div id="spinner" role="status" style="display:none">Loading...</div>
<div id="out" aria-live="polite"></div>

<script>
document.getElementById('load').addEventListener('click', async () => {
  const spinner = document.getElementById('spinner');
  spinner.style.display = 'block';
  try {
    const r = await fetch('/api/greeting');
    const j = await r.json();
    document.getElementById('out').textContent = j.message;
  } finally {
    spinner.style.display = 'none';
  }
});
</script>
</body>
</html>
