<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scroll directions demo</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  #plane { width: 4000px; height: 4000px; }
  #readout {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    padding: 10px 14px; border: 2px solid #315fd6; border-radius: 8px;
    background: #f7f5ef; font-size: 20px; font-weight: bold;
  }
</style>
</head>
<body>
  <div id="readout">region: top-left</div>
  <div id="plane"></div>
  <script>
    // Coarse region label: thresholds sit well inside the scroll range
    // (max scroll is ~4000px minus one viewport on each axis), so wheel
    // granularity or rounding can never flip a label.
    function region() {
      var v = window.scrollY > 1000 ? 'bottom' : 'top';
      var h = window.scrollX > 1000 ? 'right' : 'left';
      return 'region: ' + v + '-' + h;
    }
    var readout = document.getElementById('readout');
    function update() { readout.textContent = region(); }
    window.addEventListener('scroll', update);
    update();
  </script>
</body>
</html>
