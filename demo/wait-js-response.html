<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qaloop wait: js and response demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  #out { margin: 1rem 0; padding: 1rem; border: 1px solid #ccc; min-height: 2rem; }
  button { padding: .5rem 1.25rem; }
</style>
</head>
<body>
<h1>Wait: js &amp; response demo</h1>
<button id="load">Load data</button>
<div id="out" role="status" aria-live="polite"></div>

<script>
document.getElementById('load').addEventListener('click', async () => {
  const r = await fetch('/api/waitdata');
  const j = await r.json();
  document.getElementById('out').textContent = j.message;
  // The app flag lands only after the body is parsed and rendered —
  // strictly after the network-response step passes (headers only).
  window.dataLoaded = true;
});
</script>
</body>
</html>
