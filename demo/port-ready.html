<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Port-gated service demo</title></head>
<body>
  <h1>Port-gated demo service</h1>
  <p id="ready-note">This page is served only by the port-gated service.</p>
  <button id="load">Load status</button>
  <p id="out"></p>
  <script>
    document.getElementById("load").addEventListener("click", async () => {
      const r = await fetch("/api/port-status");
      const data = await r.json();
      document.getElementById("out").textContent = data.status;
    });
  </script>
</body>
</html>
