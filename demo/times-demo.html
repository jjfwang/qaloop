<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qaloop mock times demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  .slot { margin: 1rem 0; padding: 1rem; border: 1px solid #ccc; min-height: 2rem; }
  button { margin-top: 1rem; padding: .5rem 1.25rem; }
</style>
</head>
<body>
<h1>Mock times demo</h1>
<p>Each click fetches /demo/times-data.json once. The first fetch result
lands in the first slot, the second in the second slot, so a mocked
response and a real (fallthrough) response are observably different.</p>
<button id="fetch-btn">Fetch data</button>
<div id="first" class="slot" role="status" aria-live="polite"></div>
<div id="second" class="slot" role="status" aria-live="polite"></div>

<script>
let n = 0;
document.getElementById('fetch-btn').addEventListener('click', async () => {
  n += 1;
  const slot = document.getElementById(n === 1 ? 'first' : 'second');
  const r = await fetch('/demo/times-data.json', {cache: 'no-store'});
  const j = await r.json();
  slot.textContent = j.message;
});
</script>
</body>
</html>
