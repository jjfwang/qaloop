version: 1
name: game-grooming-breath-channel
description: >-
  Rhythm grooming client surface (issue #683): the breath-phase clock is
  legible from the tick alone with audio off (inhale expands, exhale
  contracts, grooming deepens — qualitative, no numbers), the PET_GROOM
  stroke envelope carries the server command type, and the grooming offer
  chip renders Chinese-first. The wire module is DOM-free and import-free,
  so the flow evaluates it in-page; unknown cues render nothing (OD-005).
target: ${TARGET_URL}

setup:
  - name: fresh profile so no overlay claims first-paint
    seed: {js: "localStorage.clear()"}
  - name: open the client (fixture socket must be up on :3123)
    goto: /

steps:
  - name: S-01 handshake completes — World HUD is up
    wait: {target: "#connection-state", state: visible, text: "Connected — a new game session started.", timeout_ms: 20000}
    expect:
      - text_contains: {selector: "#connection-state", text: "Connected — a new game session started."}

  - name: S-02 breath channel is legible from the tick alone (audio off — no audio input reaches the glyph)
    expect:
      - js:
          script: >-
            (async () => { const w = await import(new URL('./wire.mjs',
            location.href).href); const at = (t, g) =>
            JSON.stringify(w.breathGlyphState({tick: t, grooming: !!g}));
            return [at(5), at(15), at(15, true)].join(' | '); })()
          contains: '"phase":"inhale","motion":"expanding","depth":"steady"'
      - js:
          script: >-
            (async () => { const w = await import(new URL('./wire.mjs',
            location.href).href); const at = (t, g) =>
            JSON.stringify(w.breathGlyphState({tick: t, grooming: !!g}));
            return [at(5), at(15), at(15, true)].join(' | '); })()
          contains: '"phase":"exhale","motion":"contracting","depth":"deepening"'

  - name: S-03 stroke envelope carries the server-authored PET_GROOM command type
    expect:
      - js:
          script: >-
            (async () => { const w = await import(new URL('./wire.mjs',
            location.href).href); const e = w.buildGroomCommand({sessionId:
            's', commandId: 'c', targetTick: 15}); return
            e.commandType + ' ' + JSON.stringify(e.payload); })()
          contains: 'PET_GROOM {"actionKey":"groom"}'

  - name: S-04 grooming offer chip renders Chinese-first; unknown cues render nothing (OD-005)
    expect:
      - js:
          script: >-
            (async () => { const w = await import(new URL('./wire.mjs',
            location.href).href); return w.groomingWord('grooming-offer') +
            ' / ' + String(w.groomingWord('grooming-score')); })()
          contains: "它凑过来，呼吸放得又轻又慢——好像想让你帮它顺顺毛。 / null"

teardown:
  - name: clean profile state
    seed: {js: "localStorage.clear()"}

artifacts: {screenshot: per-step, ax_snapshot: on-failure, trace: true}
timeouts: {step_ms: 25000, run_ms: 180000}
investigate_on_failure: true
max_investigation_actions: 20
