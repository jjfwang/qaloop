name: demo-screenshot-element
description: >-
  Browser proof for the element (selector:) form of the screenshot_matches
  assertion (issue #170, SPEC.md screenshot_matches section): the baseline
  under flows/baselines/ was captured from the #card-a element alone via
  qaloop baselines, the positive step re-captures that element in a real
  browser and passes with rms_diff at or below max_diff, and a negative
  control asserting the same baseline against the different #card-b element
  fails with rms_diff above max_diff named in the detail - the selector,
  not the page, decides the result. A missing-baseline control asserts a
  baseline that is never created (baselines/never-created.png) against
  #card-a and fails closed with a baseline missing detail pointing at
  qaloop baselines.
target: ${TARGET_URL}

setup:
  - name: open the screenshot element demo page
    goto: /demo/screenshot-element.html

steps:
  - name: card-a element matches its element baseline
    expect:
      - screenshot_matches: {baseline: "baselines/element-card-a.png", selector: "#card-a", max_diff: 0.02}

  - name: negative control - same baseline against card-b fails naming rms_diff
    continue_on_fail: true
    expect:
      - screenshot_matches: {baseline: "baselines/element-card-a.png", selector: "#card-b", max_diff: 0.02}

  - name: missing-baseline fail-closed control - never-created baseline fails naming baseline missing
    continue_on_fail: true
    expect:
      - screenshot_matches: {baseline: "baselines/never-created.png", selector: "#card-a"}

  - name: card-a still matches after the negative control
    expect:
      - screenshot_matches: {baseline: "baselines/element-card-a.png", selector: "#card-a", max_diff: 0.02}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
