name: demo-screenshot-on-failure
description: >-
  Browser proof for the step-level screenshot: on-failure override (issue
  #168): under a flow-level artifacts.screenshot: per-step policy, a passing
  step carrying screenshot: on-failure captures nothing, a failing step
  carrying screenshot: on-failure (with continue_on_fail: true) captures its
  screenshot while the run proceeds, and a plain sibling step still captures
  under the per-step policy. The run's steps/ dir must NOT contain
  steps-00.png (the passing on-failure step), MUST contain steps-01.png (the
  failing on-failure step), and MUST contain steps-02.png (the plain step).
target: ${TARGET_URL}

setup:
  - name: open the dialog demo page
    goto: /demo/dialog-demo.html

steps:
  - name: on-failure step captures nothing on PASS under per-step policy
    screenshot: on-failure
    click: "#confirm-btn"
    on_dialog: dismiss
    expect:
      - text_contains: {selector: "#confirm-result", text: "cancelled"}

  - name: on-failure step captures its screenshot on FAIL and the run continues
    screenshot: on-failure
    continue_on_fail: true
    click: "#alert-btn"
    on_dialog: accept
    expect:
      - text_contains: {selector: "#alert-result", text: "this text never appears"}

  - name: plain step still captures under the per-step policy
    click: "#prompt-btn"
    on_dialog: accept
    expect:
      - text_contains: {selector: "#prompt-result", text: "prompt answered"}

teardown: []

artifacts: {screenshot: per-step, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
