version: 1
name: game-camp-editor
description: >-
  Camp editor (issue #776): from the connected World HUD the player opens the
  camp placement editor, sees all five catalog slots with Chinese-first labels
  and words-only state (the food-storage slot reads the cache band word
  用完了 on a fresh empty cache), then Esc returns to the bare World HUD.
  Deterministic fixture: no timers, no counts on the wire.
target: ${TARGET_URL}

setup:
  - name: fresh profile so no overlay claims first-paint
    seed: {js: "localStorage.clear()"}
  - name: open the client (fixture socket must be up on :3123 with --snapshot camp-empty — the SNAPSHOT is what creates #camp-open)
    goto: /

steps:
  - name: S-01 handshake completes — World HUD is up
    wait: {target: "#connection-state", state: visible, text: "Connected — a new game session started.", timeout_ms: 20000}
    expect:
      - text_contains: {selector: "#connection-state", text: "Connected — a new game session started."}
      - hidden: "#camp-panel"

  - name: S-02 guided first moment renders (fresh profile guarantees it)
    wait: {target: "#guidance-overlay", state: visible, timeout_ms: 20000}
    expect:
      - visible: "#guidance-follow"

  - name: S-03 f1 follow dismisses guidance (same as game-live-session.yaml S-03)
    click: "#guidance-follow"
    expect:
      - hidden: "#guidance-overlay"

  - name: S-04 open the camp editor from the player-panel entry
    click: "#camp-open"
    expect:
      - visible: "#camp-panel"
      - text_contains: {selector: "#camp-title", text: "营地布置"}
      - count: {selector: ".camp-slot", equals: 5}

  - name: S-05 all five slots render with Chinese-first labels
    expect:
      - text_contains: {selector: "#camp-slots", text: "庇护所"}
      - text_contains: {selector: "#camp-slots", text: "存粮处"}
      - text_contains: {selector: "#camp-slots", text: "休息处"}
      - text_contains: {selector: "#camp-slots", text: "玩耍与训练"}
      - text_contains: {selector: "#camp-slots", text: "杂物处"}

  - name: S-06 food-storage slot reads the cache band word on a fresh empty cache
    expect:
      - text_contains: {selector: "#camp-slots", text: "用完了"}
      - text_contains: {selector: "#camp-slots", text: "空着"}

  - name: S-07 Esc closes the editor back to the bare World HUD
    press: {target: "#camp-back", key: "Escape"}
    expect:
      - hidden: "#camp-panel"
      - visible: "#camp-open"

teardown:
  - name: clean profile state
    seed: {js: "localStorage.clear()"}

artifacts: {screenshot: per-step, ax_snapshot: on-failure, trace: true}
timeouts: {step_ms: 25000, run_ms: 180000}
investigate_on_failure: true
