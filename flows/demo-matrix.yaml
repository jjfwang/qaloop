version: 1
name: demo-matrix
description: >-
  Browser proof for data-driven matrix flows (issue #88): the same steps
  run once per matrix combination (2 users x 2 plans = 4 runs), with
  ${user} and ${plan} interpolated from each combination's variable map.
  Matrix names count as pre-initialized variables, so no store step is
  needed.
target: ${TARGET_URL}

matrix:
  user: [ada, bob]
  plan: [pro, free]

setup:
  - name: mock the greeting API (no backend needed)
    mock: {url: "**/api/greeting", json: {greeting: "Hello from mock"}}
  - name: open the demo page
    goto: /demo/mock-demo.html

steps:
  - name: mocked data renders for the combination
    click: "#load"
    expect:
      - text_contains: {selector: "#out", text: "Hello from mock"}

  - name: fill the signup form as the matrix user
    fill: {target: "#name", text: "${user}"}

  - name: fill the email for the matrix plan
    fill: {target: "#email", text: "${user}@${plan}.example.com"}

  - name: submit and see the mocked confirmation
    click: "#submit"
    expect:
      - text_contains: {selector: "#done", text: "Welcome, "}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
