version: 1
name: demo-mock-calls-range
tags: [smoke]
description: >-
  Browser proof for the mock_calls assertion range comparators (issue
  #206, SPEC.md Assertions table: mock_calls is {url, equals: n} /
  {url, gte: n} / {url, lte: n}). The mock for
  /demo/range-payload.txt is registered with no times: limit, so every
  click of the fixture page's button is served by the mock and the
  runner's served-hit counter grows deterministically: 1, then 2, then
  3; the page renders the same running count, pinning the served count
  by visible state too. The positive steps prove both range operators
  at and inside the boundary at each count: gte passes with the bound
  equal to the observed count and with the bound below it; lte passes
  with the bound equal to the observed count and with the bound above
  it. The negative control asserts gte 4 while only 3 hits were served
  and must FAIL naming the observed count in the runner detail form
  (mock_calls=3 want >=4) - a vacuous proof would pass it. The
  non-vacuity control (a passing gte bound raised by 1 past the actual
  served count in a scratch copy) flips that step to a failure naming
  the observed count; it is run by hand, not in this flow.
target: ${TARGET_URL}

setup:
  - name: mock the range payload endpoint with no times limit
    mock: {url: "**/demo/range-payload.txt", body: "range payload served by mock RANGE-206"}
  - name: open the mock calls range demo page
    goto: /demo/mock-calls-range-demo.html

steps:
  - name: first click is served once - gte and lte both hold at the exact boundary
    click: "#fetch-btn"
    expect:
      - text_contains: {selector: "#out", text: "fetched: 1 RANGE-206"}
      - mock_calls: {url: "**/demo/range-payload.txt", gte: 1}
      - mock_calls: {url: "**/demo/range-payload.txt", lte: 1}

  - name: second click is served twice
    click: "#fetch-btn"
    expect:
      - text_contains: {selector: "#out", text: "fetched: 2 RANGE-206"}

  - name: at two served hits - gte at and below the boundary, lte at and above it
    expect:
      - mock_calls: {url: "**/demo/range-payload.txt", gte: 2}
      - mock_calls: {url: "**/demo/range-payload.txt", gte: 1}
      - mock_calls: {url: "**/demo/range-payload.txt", lte: 2}
      - mock_calls: {url: "**/demo/range-payload.txt", lte: 3}

  - name: third click is served three times
    click: "#fetch-btn"
    expect:
      - text_contains: {selector: "#out", text: "fetched: 3 RANGE-206"}

  - name: at three served hits - gte and lte both hold at the exact boundary again
    expect:
      - mock_calls: {url: "**/demo/range-payload.txt", gte: 3}
      - mock_calls: {url: "**/demo/range-payload.txt", gte: 2}
      - mock_calls: {url: "**/demo/range-payload.txt", lte: 3}
      - mock_calls: {url: "**/demo/range-payload.txt", lte: 4}

  - name: negative control - a fourth hit was never served
    continue_on_fail: true
    expect:
      - mock_calls: {url: "**/demo/range-payload.txt", gte: 4}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
