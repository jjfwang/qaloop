name: demo-upload
description: >-
  Browser proof for the upload action op (issue #76): uploads a fixture file
  to a file input via locator.set_input_files; the demo page echoes the
  picked filename into #picked.
target: ${TARGET_URL}

setup:
  - name: open the upload demo page
    goto: /demo/upload-demo.html

steps:
  - name: upload a fixture file to the file input
    upload: {target: "#resume", path: "${QALOOP_UPLOAD_DIR}/upload-fixture.txt"}
    expect:
      - text_contains: {selector: "#picked", text: "upload-fixture.txt"}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
