name: demo-screenshot-suppress
description: >-
  Browser proof for the step-level screenshot: override (issue #150, shipped
  in PR #121 / issue #97): screenshot: never suppresses capture on a step
  even under a flow-level artifacts.screenshot: per-step policy, while a
  sibling plain step still captures under the per-step policy. The run's
  steps/ dir must NOT contain steps-00.png (the never step) and MUST contain
  steps-01.png (the plain step).
target: ${TARGET_URL}

setup:
  - name: open the dialog demo page
    goto: /demo/dialog-demo.html

steps:
  - name: never step suppresses capture on PASS under per-step policy
    screenshot: never
    click: "#confirm-btn"
    on_dialog: dismiss
    expect:
      - text_contains: {selector: "#confirm-result", text: "cancelled"}

  - name: plain step still captures under the per-step policy
    click: "#alert-btn"
    on_dialog: accept
    expect:
      - text_contains: {selector: "#alert-result", text: "alert acknowledged"}

teardown: []

artifacts: {screenshot: per-step, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
