# Inner fragment for issue #244 (include expansion in setup/teardown
# and nested include end-to-end).
#
# This fragment is included by bare sibling filename from the outer
# fragment (flows/fragments/include-setup-outer.yaml). Its ${password}
# comes only from the nested include's own `with:` mapping declared in
# that outer fragment (lexical scoping per level).
steps:
  - name: enter the password from the nested include with
    fill: {target: "#pass", text: "${password}"}
