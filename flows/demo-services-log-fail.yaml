version: 1
name: demo-services-log-fail
tags: [smoke]
description: >-
  Automated non-vacuity boot control for the services wait
  log_contains form (issue #278, companion to issue #186 /
  demo-services-log). The service command, cwd, and fixture are
  identical to demo-services-log, but the needle is a string the
  fixture never prints, so boot must fail closed at timeout_s:
  qaloop/env.py boot_command raises TimeoutError "log never
  contained <needle> after <timeout_s>s" and qaloop/cli.py prints
  SERVICE BOOT FAILED. This flow is expected to FAIL at boot - its
  steps never run. The proof is the verify command's failure
  output, its non-zero exit code, no run recorded as passed, and
  no orphaned fixture process left alive afterwards.
services:
  - name: logsvc
    command: "python3 demo/log_ready_server.py"
    cwd: ".."
    wait: {log_contains: "LOGREADY-NEVER a needle the fixture never prints"}
    timeout_s: 5
    url: "http://127.0.0.1:8941/"
target: ${QALOOP_SERVICE_LOGSVC_URL}

setup:
  - name: open the page served by the log-gated service
    goto: /demo/log-ready.html

steps:
  - name: the log-gated service serves its own page
    expect:
      - text_contains: {selector: "#ready-note", text: "served only by the log-gated service"}

  - name: load the status only this service answers
    click: "#load"
    expect:
      - text_contains: {selector: "#out", text: "log-gated service answered"}

  - name: negative control - the service never renders this text
    continue_on_fail: true
    expect:
      - text_contains: {selector: "#out", text: "LOGSVC-WRONG never rendered"}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
