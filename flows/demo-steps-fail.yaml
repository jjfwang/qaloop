version: 1
name: demo-steps-fail
tags: [smoke]
description: >-
  Browser proof for the steps-phase abort contract (issue #288,
  SPEC.md step meta keys: continue_on_fail defaults to false, so a
  failed step aborts the run). Every other aborting demo flow fails
  in setup or on a run-level deadline, so the steps-phase abort had
  zero runnable-demo adoption. This flow reuses
  demo/teardown-demo.html unchanged. The setup phase opens the page.
  The steps phase plants a localStorage value with a page-JS seed and
  asserts it reads back (the anchor, which must pass), then a
  designed failing step asserts the planted key equals a wrong value
  with a step-level timeout_ms of 1000 and NO continue_on_fail - it
  must record failed, with an error naming the observed value
  (storage local.qaloop_teardown='STEPS-288 planted' want
  ='STEPS-288 wrong-value'). The two later steps-phase steps would
  both pass if they ran (reading the planted value back through the
  page and through a storage assertion), and both must instead
  record skipped, none dropped. The teardown phase must still run on
  the live page after the abort: it clears localStorage with a
  page-JS seed and then clicks the read button and asserts the
  rendered absent marker, and both teardown steps must record
  passed. Proof is the run record: run.json shows phase statuses
  exactly setup [passed], steps [passed, failed, skipped, skipped],
  teardown [passed, passed], the overall run status failed, and
  REPORT.md renders failed. The run is therefore EXPECTED to fail
  with exit 1 - that failure is the proof.
target: ${TARGET_URL}

setup:
  - name: open the teardown demo page
    goto: /demo/teardown-demo.html

steps:
  - name: plant state with a page-JS seed and read it back
    seed: {js: "localStorage.setItem('qaloop_teardown', 'STEPS-288 planted');"}
    expect:
      - storage: {kind: local, key: "qaloop_teardown", equals: "STEPS-288 planted"}

  - name: designed failing step - planted value is not the wrong value
    timeout_ms: 1000
    expect:
      - storage: {kind: local, key: "qaloop_teardown", equals: "STEPS-288 wrong-value"}

  - name: page renders the planted storage value
    click: "#read-btn"
    expect:
      - text_contains: {selector: "#out", text: "stored: STEPS-288 planted"}

  - name: storage assertion reads the planted localStorage value
    expect:
      - storage: {kind: local, key: "qaloop_teardown", equals: "STEPS-288 planted"}

teardown:
  - name: teardown clears the planted state
    seed: {js: "localStorage.clear()"}

  - name: teardown page renders the absent marker
    click: "#read-btn"
    expect:
      - text_contains: {selector: "#out", text: "stored: (absent)"}

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
