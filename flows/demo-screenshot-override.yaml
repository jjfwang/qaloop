name: demo-screenshot-override
description: >-
  Browser proof for the step-level screenshot: override (issue #150, shipped
  in PR #121 / issue #97): screenshot: always forces a screenshot capture on
  a PASSING step even under a flow-level artifacts.screenshot: on-failure
  policy, while a plain step with no key inherits the flow policy (no capture
  on PASS). The run's steps/ dir must contain steps-00.png (the always step)
  and must NOT contain steps-01.png (the plain step).
target: ${TARGET_URL}

setup:
  - name: open the dialog demo page
    goto: /demo/dialog-demo.html

steps:
  - name: always step captures a screenshot on PASS under on-failure policy
    screenshot: always
    click: "#confirm-btn"
    on_dialog: dismiss
    expect:
      - text_contains: {selector: "#confirm-result", text: "cancelled"}

  - name: plain step inherits the flow policy and captures nothing on PASS
    click: "#alert-btn"
    on_dialog: accept
    expect:
      - text_contains: {selector: "#alert-result", text: "alert acknowledged"}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
