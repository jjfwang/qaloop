version: 1
name: demo-request-body
description: >-
  Browser proof for opt-in request-body recording and the request_body
  assertion (issue #83): the /api/save endpoint is mocked (no backend),
  the page POSTs a JSON payload via fetch, the flow waits for the
  response, then asserts the recorded body contains (and equals) the
  payload. record_bodies: true is the opt-in that makes the `body` key
  appear in network.jsonl.
target: ${TARGET_URL}
record_bodies: true

setup:
  - name: mock the save API (no backend needed)
    # delay_ms: the mock answers after 600ms so the response event fires
    # after the `wait: {response: ...}` step starts listening (same pattern
    # as flows/demo-wait-js-response.yaml)
    mock: {url: "**/api/save", method: POST, json: {ok: true}, delay_ms: 600}
  - name: open the demo page
    goto: /demo/mock-demo.html

steps:
  - name: POST the payload via fetch (fire-and-forget)
    # `void` discards the fetch promise: page.evaluate would otherwise
    # await it, and the response event would fire before the next step's
    # `wait: {response: ...}` starts listening.
    script: {js: "void fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pet:'fluffy',hp:42})})"}

  - name: wait for the save response
    wait: {response: "/api/save", timeout_ms: 10000}

  - name: the recorded request body matches the payload
    expect:
      - request_body: {url: "/api/save", contains: '"pet":"fluffy"'}
      - request_body: {url: "/api/save", equals: '{"pet":"fluffy","hp":42}'}

teardown: []

artifacts: {screenshot: on-failure, ax_snapshot: on-failure, trace: false}
timeouts: {step_ms: 15000, run_ms: 120000}
investigate_on_failure: false
